# Cloudflare Workers 정적 자산(Static Assets) 배포 설정.
#
# dist/ 는 이미 완성된 상태로 저장소에 커밋되어 있으므로 빌드 단계가 없다.
# `npx wrangler deploy` 가 dist/ 를 그대로 업로드해서 서빙한다.
#
#   html_handling  : /경기도/포천시/ 같은 디렉터리 주소를 index.html 로 연결
#   not_found_handling : 없는 주소는 평범한 404 (별도 404 페이지를 두지 않음)
#
# dist/_headers 의 캐시 설정도 그대로 적용된다.

name = "parking"
compatibility_date = "2026-09-08"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
